<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>计时悬浮窗</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background: transparent;
        }
        .bubble {
            width: 100%;
            height: 100%;
            background: rgba(30, 30, 40, 0.82);
            border-radius: 12px;
            padding: 6px 10px;
            color: #fff;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: grab;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            transition: background 0.15s;
        }
        .bubble.dragging { cursor: grabbing; }

        .row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            line-height: 1.4;
            padding: 3px 0;
        }
        .row + .row {
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .icon { font-size: 11px; flex-shrink: 0; opacity: 0.75; width: 16px; }
        .name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.9;
        }
        .time {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            color: #b388ff;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            font-size: 13px;
        }
        .time.countup { color: #6b9de8; }
        .time.paused { color: #e8b060; opacity: 0.9; }

        /* 悬停显示的操作按钮 */
        .row-actions {
            display: none;
            gap: 3px;
            flex-shrink: 0;
            margin-left: 2px;
        }
        .bubble:hover .row-actions {
            display: flex;
        }

        .row-action-btn {
            background: rgba(255,255,255,0.14);
            border: none;
            border-radius: 4px;
            color: #fff;
            width: 22px;
            height: 22px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: background 0.15s;
            font-family: inherit;
        }
        .row-action-btn:hover {
            background: rgba(255,255,255,0.32);
        }
        .row-action-btn.close:hover {
            background: rgba(244, 67, 54, 0.8);
        }

        .more {
            font-size: 10px;
            opacity: 0.5;
            text-align: center;
            margin-top: 2px;
            padding-top: 2px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .empty {
            font-size: 11px;
            opacity: 0.5;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="bubble" id="bubble"></div>
    <script src="src/renderer/timer-bubble.js"></script>
</body>
</html>
